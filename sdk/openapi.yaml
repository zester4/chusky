openapi: 3.1.0
info:
  title: Chusky Developer API
  version: 1.0.0
  description: Self-hosted Chusky SDK API. Project/root API keys are server-side only. The first-party web dashboard may authenticate user-scoped resources with its Better Auth session cookie.
servers:
  - url: https://chusky.up.railway.app/v1
security:
  - bearerAuth: []
paths:
  /mcp/catalog:
    get: { summary: List built-in MCP servers and the authenticated user's custom servers, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Owner-scoped MCP server catalogue } } }
  /mcp/connections:
    get: { summary: List owner-scoped MCP connections, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Connected servers and verification metadata } } }
    post: { summary: Connect a built-in MCP server, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Connected after MCP initialization and tool discovery }, '400': { description: Invalid credentials or verification failure } } }
  /mcp/custom-servers:
    post: { summary: Verify and add an account-owned MCP server using Streamable HTTP with legacy HTTP+SSE fallback, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, url, auth], properties: { name: { type: string, maxLength: 120 }, url: { type: string, format: uri }, auth: { type: string, enum: [none, bearer] }, accessToken: { type: string, writeOnly: true }, allowedTools: { type: array, maxItems: 500, items: { type: string } }, requireApproval: { type: boolean, default: true } } } } } }, responses: { '201': { description: Server initialized and at least one tool discovered; credentials are encrypted at rest }, '400': { description: Invalid server, authentication, or failed verification }, '403': { description: MCP write scope required } } }
  /mcp/connections/{serverId}:
    delete: { summary: Disconnect an owner-scoped MCP server, parameters: [{ name: serverId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '204': { description: Disconnected }, '404': { description: Not connected to this account } } }
  /admin/projects:
    get: { summary: List root-managed developer projects, responses: { '200': { description: OK } } }
    post: { summary: Create a developer project and return its key exactly once, responses: { '201': { description: Created } } }
  /admin/audit-events:
    get: { summary: List root control-plane audit events, responses: { '200': { description: OK } } }
  /admin/projects/{projectId}:
    patch: { summary: Replace scopes for an active project, responses: { '200': { description: Updated } } }
    delete: { summary: Revoke a developer project key, responses: { '204': { description: Revoked } } }
  /admin/projects/{projectId}/rotate-key:
    post: { summary: Replace a project key and return the new value exactly once, responses: { '201': { description: Rotated } } }
  /account/projects:
    get: { summary: List personal projects or projects attached to a verified organization member, responses: { '200': { description: OK } } }
    post: { summary: Create a personal or organization project and return its key exactly once, responses: { '201': { description: Created }, '403': { description: Dashboard session, verified email, or organization admin required }, '409': { description: Active key limit reached } } }
  /account/projects/{projectId}:
    patch: { summary: Replace scopes for the authenticated owner's active project key, responses: { '200': { description: Updated }, '404': { description: Not found } } }
    delete: { summary: Revoke the authenticated owner's project key, responses: { '204': { description: Revoked }, '404': { description: Not found } } }
  /account/projects/{projectId}/rotate-key:
    post: { summary: Rotate the authenticated owner's project key and return it exactly once, responses: { '201': { description: Rotated }, '404': { description: Not found } } }
  /account/projects/{projectId}/company/runs:
    get: { summary: List status-only company run summaries for a workspace owner or admin, responses: { '200': { description: OK }, '404': { description: Not found } } }
  /account/projects/{projectId}/company/audit-events:
    get: { summary: List bounded company project audit events for a workspace owner or admin, responses: { '200': { description: OK }, '404': { description: Not found } } }
  /account/projects/{projectId}/company/usage:
    get: { summary: Read company project usage for a workspace owner or admin, responses: { '200': { description: OK }, '404': { description: Not found } } }
  /account/projects/{projectId}/policy:
    get: { summary: Read an organization project policy as a verified member, responses: { '200': { description: OK }, '404': { description: Not found } } }
    put: { summary: Replace project tool grants and per-run budgets as an owner or admin, responses: { '200': { description: Updated }, '400': { description: Invalid policy }, '404': { description: Not found } } }
  /account/autonomy/queue:
    get: { summary: Read the authenticated owner's unified personal or business autonomy queue, parameters: [{ $ref: '#/components/parameters/UserId' }, { name: mode, in: query, required: false, schema: { type: string, enum: [personal, business] } }], responses: { '200': { description: Owner-scoped autonomy snapshot including profile, watches, blockers, and next checks }, '403': { description: Owner link required } } }
  /account/autonomy/reconcile:
    post: { summary: Run due owner-configured read-only autonomy watches and persist checkpoints, requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { mode: { type: string, enum: [personal, business] }, maxWatches: { type: integer, minimum: 1, maximum: 20 } } } } } }, responses: { '200': { description: Bounded reconciliation results and gap candidates }, '403': { description: Owner link required } } }
  /account/projects/{projectId}/autonomy/queue:
    get: { summary: Read the unified business autonomy queue under a company project policy, parameters: [{ $ref: '#/components/parameters/UserId' }, { name: projectId, in: path, required: true, schema: { type: string } }], responses: { '200': { description: Company autonomy snapshot }, '404': { description: Not found } } }
  /account/projects/{projectId}/autonomy/reconcile:
    post: { summary: Run due company autonomy watches under the project policy, parameters: [{ name: projectId, in: path, required: true, schema: { type: string } }], requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { maxWatches: { type: integer, minimum: 1, maximum: 20 } } } } } }, responses: { '200': { description: Company reconciliation results }, '404': { description: Not found }, '409': { description: Autonomy disabled } } }
  /workflows/composer:
    get: { summary: List owner-scoped dependency-aware workflow composer records, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Workflow composer records } }
    post: { summary: Create a persisted dependency-aware workflow composer graph, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Created }, '400': { description: Invalid workflow graph } } }
  /workflows/composer/{workflowId}:
    patch: { summary: Update an owner-scoped workflow composer graph before or during execution, parameters: [{ name: workflowId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Updated }, '400': { description: Invalid workflow graph }, '404': { description: Not found } } }
  /workflows/composer/{workflowId}/start:
    post: { summary: Start a workflow composer graph and enqueue ready stages, parameters: [{ name: workflowId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '202': { description: Started or reconciled }, '400': { description: Workflow could not be started } } }
  /account/projects/{projectId}/agents:
    get: { summary: List organization project agent profiles as a verified member, responses: { '200': { description: OK }, '404': { description: Not found } } }
    post: { summary: Create a template-based company agent profile as an owner or admin, responses: { '201': { description: Created }, '404': { description: Not found } } }
  /agents/templates:
    get: { summary: List built-in company agent templates, responses: { '200': { description: OK } } }
  /agents:
    get: { summary: List agent profiles belonging to the current project key, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
    post: { summary: Create a template-based agent profile within the current project, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Created }, '403': { description: Invalid template or grant } } }
  /agents/{agentId}:
    get: { summary: Get one current-project agent profile, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
    patch: { summary: Update a current-project agent profile, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Updated } } }
    delete: { summary: Delete a current-project agent profile, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '204': { description: Deleted } } }
  /account/overview:
    get: { summary: Get the authenticated account overview, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /account/models:
    get: { summary: List models available to the authenticated account, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /account/organizations/{organizationId}/branding:
    get: { summary: Get safe workspace branding, parameters: [{ $ref: '#/components/parameters/UserId' }, { name: organizationId, in: path, required: true, schema: { type: string } }], responses: { '200': { description: Branding } } }
    put: { summary: Update safe workspace branding as an owner or admin, parameters: [{ $ref: '#/components/parameters/UserId' }, { name: organizationId, in: path, required: true, schema: { type: string } }], responses: { '200': { description: Updated branding } } }
  /account/preferences:
    get: { summary: Get account model and voice preferences, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Preferences } } }
    patch: { summary: Update account model and voice preferences, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Updated } } }
  /account/voice-options:
    get: { summary: List deployment-supported Flux and Bland voice options, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Voice catalogue and provider availability } } }
  /account/telegram-link:
    post: { summary: Create a Telegram linking code for the account, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Linking code } } }
  /account/calls:
    get: { summary: List account voice calls with redacted destinations, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
    post: { summary: Validate and start an outbound voice call, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Started call record } } }
  /meetings:
    get: { summary: List owner-scoped Recall meeting preparations, meetings, participants, and contacts, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
    post: { summary: Join or schedule a Recall meeting, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Meeting lifecycle record } } }
  /meetings/prepare:
    post: { summary: Generate a private client-bound meeting brief without joining, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Prepared meeting mission } } }
  /meetings/profile:
    get: { summary: Get the account meeting representative profile, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Profile } } }
    patch: { summary: Update the account meeting representative profile, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Updated profile } } }
  /meetings/preparations/{preparationId}/join:
    post: { summary: Join a verified calendar meeting preparation without returning its URL, parameters: [{ $ref: '#/components/parameters/UserId' }, { name: preparationId, in: path, required: true, schema: { type: string } }], responses: { '201': { description: Meeting lifecycle record } } }
  /meetings/{meetingId}:
    get: { summary: Get one owner-scoped Recall meeting, parameters: [{ $ref: '#/components/parameters/UserId' }, { name: meetingId, in: path, required: true, schema: { type: string } }], responses: { '200': { description: Meeting lifecycle record }, '404': { description: Not found } } }
  /meetings/{meetingId}/leave:
    post: { summary: Ask Recall to leave an owner-scoped meeting, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: meetingId, in: path, required: true, schema: { type: string } }], responses: { '200': { description: Updated meeting lifecycle record } } }
  /meetings/{meetingId}/context:
    get: { summary: Query the active representative meeting's approved business and relationship context, parameters: [{ $ref: '#/components/parameters/UserId' }, { name: meetingId, in: path, required: true, schema: { type: string } }, { name: query, in: query, required: true, schema: { type: string, maxLength: 500 } }], responses: { '200': { description: Meeting context } } }
  /meetings/contacts/{contactId}:
    delete: { summary: Delete an owner-scoped meeting follow-up contact, parameters: [{ $ref: '#/components/parameters/UserId' }, { name: contactId, in: path, required: true, schema: { type: string } }], responses: { '204': { description: Deleted }, '404': { description: Not found } } }
  /apps:
    get: { summary: List connected app toolkits, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /apps/{toolkit}/connect:
    post: { summary: Start connecting an app toolkit, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OAuth connection URL } } }
  /apps/connections:
    get: { summary: List connected Composio accounts, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /apps/connections/{connectionId}:
    delete: { summary: Disconnect an owned Composio account, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '204': { description: Disconnected } } }
  /triggers:
    get: { summary: List account triggers, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
    post: { summary: Create an account trigger, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Created } } }
  /triggers/catalog/toolkits:
    get: { summary: List Composio trigger-capable app toolkits, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /triggers/catalog/toolkits/{toolkit}:
    get: { summary: List paginated trigger types for an app toolkit, parameters: [{ $ref: '#/components/parameters/UserId' }, { name: toolkit, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  /triggers/{triggerId}:
    patch: { summary: Enable or disable an account trigger, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Updated } } }
    delete: { summary: Delete an account trigger, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '204': { description: Deleted } } }
  /threads:
    get:
      summary: List a user's threads
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses: { '200': { description: OK } }
    post:
      summary: Create a thread
      parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Created } }
  /threads/{threadId}:
    get: { summary: Get one thread, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
    patch: { summary: Update thread metadata, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Updated } } }
    delete: { summary: Delete an idle thread, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '204': { description: Deleted } } }
  /threads/{threadId}/runs:
    get:
      summary: List runs for a thread
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses: { '200': { description: Cursor page } }
    post:
      summary: Run Chusky synchronously or queue a durable task with wait=false
      parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Created } }
  /threads/{threadId}/runs/stream:
    post:
      summary: Stream an NDJSON agent run
      parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: NDJSON stream with typed run events, including safe run.tool_activity lifecycle updates } }
  /threads/{threadId}/runs/{runId}:
    get: { summary: Get a run, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /threads/{threadId}/runs/{runId}/cancel:
    post: { summary: Cancel a running run, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Cancelled } } }
  /threads/{threadId}/runs/{runId}/resume:
    post: { summary: Resume a failed, cancelled, or approval-paused run as a new durable run, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Resumed } } }
  /threads/{threadId}/runs/{runId}/events:
    get: { summary: Recover persisted run events, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /threads/{threadId}/runs/{runId}/trace:
    get: { summary: Inspect the durable model/tool/handoff trace; include_state=true returns the bounded checkpoint, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Durable trace } } }
  /approvals/{approvalId}:
    get: { summary: Get a pending approval, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
    post: { summary: Approve or deny then resume safely, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Run result } } }
  /tasks:
    get: { summary: List tasks for an SDK user, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /tasks/{taskId}:
    get: { summary: Get one task, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /tasks/{taskId}/retry:
    post: { summary: Retry a failed, blocked, or cancelled task, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Requeued } } }
  /tasks/{taskId}/cancel:
    post: { summary: Cancel a queued or running task, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Cancelled } } }
  /files:
    post: { summary: Create a direct R2 upload URL, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Presigned URL } } }
  /files/{fileId}:
    get: { summary: Create a direct R2 download URL, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Presigned URL } } }
    delete: { summary: Delete an owned R2 object and its file record, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '204': { description: Deleted } } }
  /files/{fileId}/complete:
    post: { summary: Verify an uploaded R2 object before it becomes downloadable, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Verified file } } }
  /audit-events:
    get: { summary: List bounded SDK audit events, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /company/runs:
    get: { summary: List status-only run summaries aggregated across callers of this company project; requires company:read, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK }, '404': { description: Not a company project } } }
  /company/audit-events:
    get: { summary: List bounded project audit events; requires company:read, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK }, '404': { description: Not a company project } } }
  /company/usage:
    get: { summary: Get monthly completed-run and model-cost totals for this company project; requires company:read, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK }, '404': { description: Not a company project } } }
  /usage:
    get: { summary: Get current SDK-user usage totals, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /webhooks:
    get: { summary: List webhook subscriptions, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
    post: { summary: Create an HTTPS webhook subscription, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Created } } }
  /webhooks/{webhookId}:
    patch: { summary: Enable or disable a webhook subscription, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Updated } } }
    delete: { summary: Disable a webhook subscription, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '204': { description: Disabled } } }
  /webhooks/{webhookId}/deliveries:
    get: { summary: List bounded delivery attempts, including ambiguous outcomes that require receiver verification, for a subscription, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /webhooks/{webhookId}/deliveries/{deliveryId}/retry:
    post: { summary: Requeue a definitively failed webhook delivery; ambiguous outcomes are never retried automatically, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Requeued }, '409': { description: Delivery is not in a definitively failed state } } }
  /approvals:
    get: { summary: List pending approvals for the SDK user, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /tools:
    get: { summary: List native and connected Composio tools; native tools include their JSON input schema and durable-run execution mode, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /tools/{slug}:
    get: { summary: Get one tool by exact slug; native tools include their JSON input schema and durable-run execution mode, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /skills:
    get: { summary: Search the trusted project skill catalogue, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /skills/{name}/files:
    get: { summary: List all files bundled in a skill, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /skills/{name}/files/read:
    get: { summary: Read a bounded text file from a skill, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /artifacts:
    get: { summary: List durable Daytona artifacts, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /artifacts/{id}:
    get: { summary: Get an artifact record, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
    delete: { summary: Delete an owned artifact record, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '204': { description: Deleted } } }
  /artifacts/{id}/download:
    get: { summary: Download an artifact from the persistent Daytona workspace, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Binary artifact bytes } } }
  /videos:
    get: { summary: List video generation jobs, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
    post: { summary: Queue a durable video generation job, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '202': { description: Queued } } }
  /videos/{id}:
    get: { summary: Get video job status, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /videos/{id}/cancel:
    post: { summary: Cancel a queued video job, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Cancelled } } }
  /workers:
    get: { summary: List durable sub-agent delegations, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
    post: { summary: Create a typed durable sub-agent delegation under Chusky supervision, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '202': { description: Queued } } }
  /workers/{id}:
    get: { summary: Get a sub-agent delegation and its contract, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /workers/{id}/cancel:
    post: { summary: Cancel a sub-agent delegation, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: Cancelled } } }
  /channels:
    get: { summary: List verified channel connections, parameters: [{ $ref: '#/components/parameters/UserId' }], responses: { '200': { description: OK } } }
  /channels/link-code:
    post: { summary: Create a one-time link code for Slack, WhatsApp, or Sendblue, parameters: [{ $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Link instructions } } }
  /channels/{provider}/{identityId}:
