name: Release Chusky SDK

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
    tags:
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact SDK version to publish (x.y.z)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: chusky-sdk-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Set requested version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          TAG_VERSION: ${{ startsWith(github.ref, 'refs/tags/sdk-v') && github.ref_name || '' }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version="$VERSION_INPUT"
          if [ -z "$version" ] && [ -n "$TAG_VERSION" ]; then
            version="${TAG_VERSION#sdk-v}"
          elif [ -z "$version" ] && [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "branch" ]; then
            version=$(node -p "require('./package.json').version")
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A valid SDK version is required, either as workflow input or sdk-vX.Y.Z tag"
            exit 1
          fi
          current=$(node -p "require('./package.json').version")
          if [ "$current" != "$version" ]; then
            npm version "$version" --no-git-tag-version
          fi
          test "$(node -p "require('./package.json').version")" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check npm publication state
        id: npm_version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if npm view "@chusky/sdk@$VERSION" version >/dev/null 2>&1; then
            if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "branch" ]; then
              echo "@chusky/sdk@$VERSION is already published; skipping this automatic release"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            elif [ "$REF_TYPE" = "tag" ]; then
              echo "@chusky/sdk@$VERSION is already published; continuing tag/release recovery"
              echo "published=true" >> "$GITHUB_OUTPUT"
            else
              echo "@chusky/sdk@$VERSION is already published"
              exit 1
            fi
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify package
        if: steps.npm_version.outputs.skip != 'true'
        run: |
          npm run typecheck
          npm run build
          npm test
      - name: Ensure npm publishing is configured
        if: steps.npm_version.outputs.published != 'true' && steps.npm_version.outputs.skip != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: test -n "$NPM_TOKEN"
      - name: Publish package
        if: steps.npm_version.outputs.published != 'true' && steps.npm_version.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # npm provenance currently rejects private GitHub source repositories.
        # The package remains public; authentication is provided by NPM_TOKEN.
        run: npm publish --access public
      - name: Commit and tag release
        if: steps.npm_version.outputs.skip != 'true' && steps.release_tag.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add package.json package-lock.json
            git commit -m "chore: release SDK v$VERSION"
            git push origin HEAD:main
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/sdk-v$VERSION" >/dev/null 2>&1; then
            echo "sdk-v$VERSION already exists"
          else
            git tag -a "sdk-v$VERSION" -m "Chusky SDK v$VERSION"
            git push origin "sdk-v$VERSION"
          fi
      - name: Create GitHub release
        if: steps.npm_version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "sdk-v$VERSION" >/dev/null 2>&1; then
            echo "GitHub release sdk-v$VERSION already exists"
          else
            gh release create "sdk-v$VERSION" --title "Chusky SDK v$VERSION" --generate-notes
          fi
