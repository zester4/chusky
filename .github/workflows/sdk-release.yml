name: Chusky SDK Release

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact SDK version (x.y.z). Leave blank to use release type."
        required: false
        type: string
      release_type:
        description: "Semantic version increment when an exact version is not supplied"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: chusky-sdk-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ci-test-telegram-token
      COMPOSIO_API_KEY: ci-test-composio-key
      OPENROUTER_API_KEY: ci-test-openrouter-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify the application and SDK
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run build:sdk
          npm run test:sdk
      - name: Bump SDK version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          TAG_VERSION: ${{ startsWith(github.ref, 'refs/tags/sdk-v') && github.ref_name || '' }}
        run: |
          if [ -n "$TAG_VERSION" ]; then
            npm run sdk:version -- "${TAG_VERSION#sdk-v}"
          elif [ -n "$VERSION_INPUT" ]; then
            npm run sdk:version -- "$VERSION_INPUT"
          else
            npm run sdk:version -- "$RELEASE_TYPE"
          fi
          version=$(node -p "require('./sdk/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check release tag
        id: release_tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/sdk-v$VERSION" >/dev/null 2>&1; then
            echo "sdk-v$VERSION already exists; continuing as a publish recovery"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure npm publishing is configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: test -n "$NPM_TOKEN"
      - name: Check package version in npm
        id: npm_version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@chusky/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "@chusky/sdk@$VERSION is already published"
              exit 1
            fi
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.npm_version.outputs.published != 'true'
        working-directory: sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
      - name: Commit and tag release
        if: steps.release_tag.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk/package.json sdk/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(sdk): release v$VERSION"
          fi
          git tag -a "sdk-v$VERSION" -m "Chusky SDK v$VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "sdk-v$VERSION"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "sdk-v$VERSION" >/dev/null 2>&1; then
            echo "GitHub release sdk-v$VERSION already exists"
          else
            gh release create "sdk-v$VERSION" --title "Chusky SDK v$VERSION" --generate-notes
          fi
