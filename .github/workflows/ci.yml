name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The test suite imports src/config.ts. These are non-secret placeholders;
    # provider calls are mocked by the contract tests and no real credentials
    # belong in CI.
    env:
      TELEGRAM_BOT_TOKEN: ci-test-telegram-token
      COMPOSIO_API_KEY: ci-test-composio-key
      OPENROUTER_API_KEY: ci-test-openrouter-key
    steps:
      - name: Require read-only chusky-web deploy key
        env:
          CHUSKY_WEB_SUBMODULE_DEPLOY_KEY: ${{ secrets.CHUSKY_WEB_SUBMODULE_DEPLOY_KEY }}
        run: |
          if [ -z "$CHUSKY_WEB_SUBMODULE_DEPLOY_KEY" ]; then
            echo "::error::The read-only chusky-web deploy key is not configured for this repository's Actions secrets."
            exit 1
          fi
      - name: Route chusky-web submodule through SSH
        run: git config --global url."git@github.com:zester4/chusky-web.git".insteadOf "https://github.com/zester4/chusky-web.git"
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ssh-key: ${{ secrets.CHUSKY_WEB_SUBMODULE_DEPLOY_KEY }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install media test dependency
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:sdk
      - run: npm run test:sdk
      - run: git diff --check
