name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The test suite imports src/config.ts. These are non-secret placeholders;
    # provider calls are mocked by the contract tests and no real credentials
    # belong in CI.
    env:
      TELEGRAM_BOT_TOKEN: ci-test-telegram-token
      COMPOSIO_API_KEY: ci-test-composio-key
      OPENROUTER_API_KEY: ci-test-openrouter-key
    steps:
      - name: Require private submodule read token
        env:
          CHUSKY_SUBMODULES_READ_TOKEN: ${{ secrets.CHUSKY_SUBMODULES_READ_TOKEN }}
        run: |
          if [ -z "$CHUSKY_SUBMODULES_READ_TOKEN" ]; then
            echo "::error::Set CHUSKY_SUBMODULES_READ_TOKEN with read access to the private chusky-web repository."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CHUSKY_SUBMODULES_READ_TOKEN }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install media test dependency
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:sdk
      - run: npm run test:sdk
      - run: git diff --check
